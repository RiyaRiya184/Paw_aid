<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Paw Aid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="brand"><span class="paw">🐕</span> Paw Aid</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="report-dog.html">Report a Dog</a></li>
      <li><a href="track-reports.html">Track a Report</a></li>
    </ul>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-ghost">Log In</a>
    </div>
    <button class="nav-toggle" aria-label="Menu">☰</button>
  </div>
</header>

<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-head">
      <div class="paw">🐾</div>
      <h1 style="font-size:1.7rem;">Choose a new password</h1>
      <p>Enter a new password for your Paw Aid account.</p>
    </div>

    <form id="resetForm">
      <div class="field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" placeholder="At least 8 characters" required>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Update Password</button>
    </form>

    <p class="form-foot">Remembered it? <a href="login.html">Log in</a></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
