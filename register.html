<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Paw Aid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="brand"><span class="paw">🐕</span> Paw Aid</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="report-dog.html">Report a Dog</a></li>
      <li><a href="track-reports.html">Track a Report</a></li>
    </ul>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-ghost">Log In</a>
    </div>
    <button class="nav-toggle" aria-label="Menu">☰</button>
  </div>
</header>

<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-head">
      <div class="paw">🐾</div>
      <h1 style="font-size:1.7rem;">Create your account</h1>
      <p>Join Paw Aid as a citizen or register your NGO.</p>
    </div>

    <div class="role-toggle" data-role="citizen">
      <button type="button" class="active" data-role="citizen">Citizen</button>
      <button type="button" data-role="ngo">NGO</button>
    </div>

    <div id="formSuccess" class="alert alert-success">Account created! Redirecting you to log in…</div>

    <form id="registerForm">
      <div class="field">
        <label for="fullName">Full name / Organization name</label>
        <input type="text" id="fullName" placeholder="e.g. Aisha Khan" required>
      </div>
      <div class="field">
        <label for="regEmail">Email address</label>
        <input type="email" id="regEmail" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="regPhone">Phone number</label>
        <input type="tel" id="regPhone" placeholder="98765 43210" required>
      </div>
      <div class="field">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" placeholder="At least 8 characters" required>
      </div>
      <div class="field">
        <label class="checkbox-row">
          <input type="checkbox" style="width:auto;" required>
          I agree to the Terms of Service and Privacy Policy
        </label>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <p class="form-foot">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
